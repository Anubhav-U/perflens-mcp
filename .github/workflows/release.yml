name: Release

# Publishes to npm when a version tag is pushed, e.g.:
#   npm version patch   (bumps package.json and creates the tag v0.1.1)
#   git push --follow-tags
#
# Uses npm trusted publishing (OIDC): GitHub proves to npm that this workflow is running for this
# repo, so no npm token is stored anywhere. Configure it once on npmjs.com:
#   package settings > Trusted publishing > GitHub Actions
#   owner Anubhav-U, repository perflens-mcp, workflow release.yml, environment npm
# Provenance is attached automatically.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # lets GitHub issue the short-lived identity token npm verifies

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a newer npm CLI than the one bundled with Node 22.
      - run: npm install -g npm@latest

      - name: Tag must match package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Publish to npm
        run: npm publish --access public
